name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # api/pyproject.toml declares open-ended lower bounds with no lockfile
    # (see CONTRIBUTING.md) — this weekly run is what catches a real
    # regression against newer dependency releases before a contributor
    # does, instead of leaving that gap silent between pushes.
    - cron: "0 6 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: cd api && pip install -r requirements.txt
      - run: cd api && pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx tsc --noEmit
      - run: cd web && npm run lint
      - run: cd web && npm run build
