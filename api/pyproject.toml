[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeway"
version = "0.1.0"
description = "Forgeway workload intelligence layer — decision engine, CLI, and hardware discovery."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
forgeway = "app.cli.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
